name: build-image

on:
  push:
    branches: [master]          # 推 main 自动构建
    tags: ["v*"]              # 打 tag 也构建（产出语义化版本标签）
  workflow_dispatch:          # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # 允许推送 GHCR
    steps:
      - uses: actions/checkout@v4

      - id: lower
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3      # ARM 跨架构模拟
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置令牌，无需配置

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.lower.outputs.image }}
          tags: |
            type=ref,event=branch      # main 分支 → :main
            type=sha                   # 每次提交 → :<短sha>，可回滚
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .                   # 用仓库根目录的 Dockerfile（三阶段构建）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha         # 层缓存，二次构建快很多
          cache-to: type=gha,mode=max
