# 覆盖文件：附带一个专属 MySQL 8 实例。
# 用法：docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
# 已有 MySQL 想共库的用户不要带这个文件，直接在 .env 里配置外部连接即可。
services:
  db:
    image: mysql:8.0
    container_name: femina-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-femina_db_pass}
      MYSQL_DATABASE: femina
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-femina_db_pass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    environment:
      # 覆盖基础文件里的默认值，指向本文件自带的实例
      FEMINA_DB_HOST: db
      FEMINA_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-femina_db_pass}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
