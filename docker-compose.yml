services:
  app:
    image: ghcr.io/scrdx/femina:${FEMINA_IMAGE_TAG:-latest}
    container_name: femina-app
    restart: unless-stopped
    ports:
      - "${FEMINA_PORT:-8090}:8080"
    environment:
      # 数据库连接。模式 A 下由 docker-compose.db.yml 覆盖为自带实例（服务名 db）；
      # 模式 B 在 .env 里填实际地址，FEMINA_DB_HOST 三选一：
      #   host.docker.internal —— 宿主机上直接跑的 MySQL（默认值，extra_hosts 已内置支持）
      #   172.17.0.1           —— docker0 网桥地址，同样指宿主机，host-gateway 不生效时兜底
      #   <容器名>             —— MySQL 在别的容器里，需两边加入同一 docker network
      #                        （本文件末尾要补 networks 段，写法见 README「模式 B」的容器变体）
      FEMINA_DB_HOST: ${FEMINA_DB_HOST:-host.docker.internal}
      FEMINA_DB_PORT: "${FEMINA_DB_PORT:-3306}"
      FEMINA_DB_NAME: ${FEMINA_DB_NAME:-femina}
      FEMINA_DB_USER: ${FEMINA_DB_USER:-root}
      FEMINA_DB_PASSWORD: ${FEMINA_DB_PASSWORD:-femina_db_pass}
      # 生产部署请务必在 .env 中修改 JWT 密钥
      FEMINA_JWT_SECRET: ${FEMINA_JWT_SECRET:-please-change-this-jwt-secret}
      # 容器内媒体根目录（添加人物时文件浏览器的默认起点）
      FEMINA_MEDIA_ROOT: /media
    extra_hosts:
      # 让容器可以用 host.docker.internal 访问 NAS 宿主机上的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      # 存放照片/视频的目录挂载到容器 /media，实际路径在 .env 里用 MEDIA_DIR 指定。
      # 以【只读】方式挂载，从操作系统层面保证系统绝不会修改或删除你的媒体文件。
      - ${MEDIA_DIR:-./data/media}:/media:ro
