services:
  app:
    image: ghcr.io/scrdx/femina:${FEMINA_IMAGE_TAG:-latest}
    container_name: femina-app
    restart: unless-stopped
    ports:
      - "${FEMINA_PORT:-8090}:8080"
    environment:
      # 数据库连接：Femina 不自带 MySQL 实例，以下五项必须在 .env 中提供，
      # 缺失时 compose 直接报错而不是用默认值连一个不存在的库。
      # FEMINA_DB_HOST 三选一：
      #   host.docker.internal —— 宿主机上直接跑的 MySQL（extra_hosts 已内置支持）
      #   172.17.0.1           —— docker0 网桥地址，同样指宿主机，host-gateway 不生效时兜底
      #   <容器名>             —— MySQL 在别的容器里，需两边加入同一 docker network
      #                        （本文件末尾要补 networks 段，写法见 README 的容器变体）
      FEMINA_DB_HOST: ${FEMINA_DB_HOST:?必须在 .env 中提供 FEMINA_DB_HOST（MySQL 地址）}
      FEMINA_DB_PORT: ${FEMINA_DB_PORT:?必须在 .env 中提供 FEMINA_DB_PORT（如 3306）}
      FEMINA_DB_NAME: ${FEMINA_DB_NAME:?必须在 .env 中提供 FEMINA_DB_NAME（数据库名）}
      FEMINA_DB_USER: ${FEMINA_DB_USER:?必须在 .env 中提供 FEMINA_DB_USER（数据库账号）}
      FEMINA_DB_PASSWORD: ${FEMINA_DB_PASSWORD:?必须在 .env 中提供 FEMINA_DB_PASSWORD（数据库密码）}
      # 生产部署请务必在 .env 中修改 JWT 密钥
      FEMINA_JWT_SECRET: ${FEMINA_JWT_SECRET:-please-change-this-jwt-secret}
      # 容器内媒体根目录（添加人物时文件浏览器的默认起点）
      FEMINA_MEDIA_ROOT: /media
      # 缩略图目录（容器内路径）。在 .env 中设 FEMINA_THUMB_DIR= 可关闭缩略图功能
      FEMINA_THUMB_DIR: ${FEMINA_THUMB_DIR:-/thumbs}
    extra_hosts:
      # 让容器可以用 host.docker.internal 访问 NAS 宿主机上的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      # 存放照片/视频的目录挂载到容器 /media，实际路径在 .env 里用 MEDIA_DIR 指定。
      # 以【只读】方式挂载，从操作系统层面保证系统绝不会修改或删除你的媒体文件。
      - ${MEDIA_DIR:-./data/media}:/media:ro
      # 缩略图缓存目录（读写），实际路径在 .env 里用 THUMB_DIR 指定。
      # 与媒体目录分离：媒体只读的铁律不受影响。
      - ${THUMB_DIR:-./data/thumbs}:/thumbs
